[project]
name = "recon-ai-functions"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34.0",
    "pydantic-settings>=2.0.0",
    "aws-lambda-powertools>=3.0.0",
    "aws-xray-sdk>=2.12.0",
    "python-ulid>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-json-report>=1.5",
    "moto[dynamodb,s3,comprehend]>=5.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"
